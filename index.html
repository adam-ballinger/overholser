<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wave</title>
<style>
  /* Named once here so emailTable's inlineStyle (further down) can read the same values instead of
     repeating the hex: a saved or emailed table can never show different colors than the page. */
  :root { color-scheme: light;
           --danger: #b3261e; --warning: #b25a00; --cyan: #0e7c86; --id: #8a5a00; --border: #b5b1a8 }
  body { margin: 0; padding: 12px 16px; background: #faf9f7; color: #1b1b19;
         font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace }
  button, .button { font: inherit; padding: 2px 10px; border: 1px solid #c9c6bf; background: #f2f0eb;
                    color: inherit; cursor: pointer }
  button:hover, .button:hover { background: #e8e5de }
  /* Header: the logo, a truck hauling "wave", with the name and version beside it (under it on a phone).
     Line height 1 so the box and block characters join up. Only characters Consolas has, so it lines up
     on any Windows machine. */
  header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 20px; margin-bottom: 10px }
  .logo { margin: 0; font: inherit; line-height: 1 }
  .logo .frame { color: #94918a }
  .logo .speed { color: #d3d0c9 }
  .logo .lamp { color: #b25a00 }
  .brand { padding-bottom: 2px; line-height: 1.4; color: #94918a }
  .brand b { color: #1b1b19 }
  #version { color: #8a5a00 }
  /* Tabs: the one showing is underlined. */
  #tabs { display: flex; margin: 0 -16px 12px; padding: 0 16px; border-bottom: 1px solid #c9c6bf }
  #tabs button { margin-bottom: -1px; padding: 4px 14px; border: 0; border-bottom: 2px solid transparent;
                 background: none; color: #94918a }
  #tabs button:hover { color: #1b1b19 }
  #tabs button.on { color: #1b1b19; border-bottom-color: #1b1b19 }

  /* Search tab */
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px }
  #filename { color: #55534d }
  /* The loading bar: "████████░░░░░░░░░░░░  40% reading". */
  #progress { color: #94918a }
  #progress b { font-weight: normal; color: #b25a00 }
  #progress i { font-style: normal; color: #d3d0c9 }
  .table-tools { justify-content: flex-end; margin-bottom: 6px }  /* bld all and save, at the right above the table */
  /* The filter bar reads as a prompt: "> --today --thd", with room around it to type in. */
  .bar { display: flex; align-items: center; gap: 8px; margin: 18px 0; border-bottom: 1px solid #c9c6bf }
  .bar > span { color: #94918a }
  /* clear (esc) is a word at the end of the bar, not another box beside the boxes above it. */
  #clear { padding: 0 0 2px; border: 0; background: none; color: #94918a }
  #clear:hover { color: #1b1b19; background: none; text-decoration: underline }
  .bar input { flex: 1; min-width: 0; font: inherit; padding: 4px 0; border: 0; outline: none; background: none; color: inherit }
  .message { color: #a4271c }
  /* Every flag the report takes, a row of buttons per group. */
  #tags { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px }
  #tags div { display: flex; flex-wrap: wrap; gap: 4px }
  #tags button { padding: 0 6px }
  .stats { display: flex; flex-wrap: wrap; gap: 2px 24px; margin: 18px 0 14px; color: #55534d }
  .stats .headline { flex-basis: 100%; color: #1b1b19 }
  .stats b { font-weight: normal; color: #94918a }
  /* The rows you clicked, each marked down its left edge: what bld and drop act on. */
  tr[data-add], tr[data-drop] { cursor: pointer }
  tr.on td { background: #e2ddd1 }
  tr.on td:first-child { box-shadow: inset 3px 0 #1b1b19 }
  /* A trip (or an order not on one) in the report: click it to see it in the inspect tab. */
  a[data-find] { cursor: pointer; color: inherit; text-decoration: underline dotted #94918a }
  a[data-find]:hover { text-decoration-style: solid }
  /* Columns keep the report's proportions but are shares of the window, so it always fits. */
  table { width: 100%; table-layout: fixed; border-collapse: collapse }
  th { text-align: left; font-weight: 600; padding: 2px 8px 4px 0; border-bottom: 1px dashed var(--border) }
  td { padding: 1px 8px 1px 0 }
  /* One line per row, cut with an ellipsis the way the report cuts to its column width. */
  th, td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  tr:hover td:not(.group) { background: #efece5 }
  /* Divider above each ship date group (late, today, tomorrow, future) and each inspect tab table. */
  .group { padding: 14px 0 3px; border-bottom: 1px solid var(--border); color: #94918a }
  .group b { color: #1b1b19; letter-spacing: 1px }
  .group.late, .group.late b { color: var(--danger); border-bottom-color: var(--danger) }
  .right { text-align: right }
  .id { color: var(--id) }                               /* order numbers */
  .danger { background: var(--danger); color: #fff }     /* late ship date, short allocation */
  .warning { background: var(--warning); color: #fff }   /* split allocation, Holds, the 144" tag */
  .cyan { background: var(--cyan); color: #fff }         /* the flr-mtl tag (temporary) */
  .danger, .warning, .cyan { padding: 0 3px }            /* on the text only, so a little room around it */
  /* Narrow windows drop columns rather than squeezing every one of them; a phone keeps
     what you can't read the row without: one order number, the date, dollars, allocation. */
  @media (max-width: 900px) { .ship-method, .items { display: none } }
  @media (max-width: 600px) {
    .ship-to, .trip, .orders, .lines, .cases, .line-statuses { display: none }
    .po, .delivery, .customer, .hold, .pieces, .onhand { display: none }  /* the inspect tab's tables */
  }

  /* Inspect tab: each trip under a heading, with its bld button at the right, tables a little apart. */
  .trip-detail h2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;
                    margin: 22px 0 0; font-size: 1.3em }
  .trip-detail h2 .muted { font-weight: normal; color: #94918a }
  /* font: inherit on buttons would take the heading's size and weight, so this one says its own. */
  .add { margin-left: auto; font-size: 13px; font-weight: normal }
  .trip-detail table { margin-bottom: 6px }

  /* Build tab: the list, with an x at the end of each row to take it off again. */
  /* What the list comes to, big, since it is the answer the tab exists to give. */
  #buildTotals { display: flex; flex-wrap: wrap; gap: 6px 36px; margin: 4px 0 16px }
  #buildTotals div { font-size: 26px; line-height: 1.1 }
  #buildTotals span { display: block; font-size: 13px; color: #94918a }
  #build-tab .num { color: #94918a }                     /* the row numbers */
  #build-tab .drop { padding: 2px 10px; border: 0; background: none; color: #94918a }
  #build-tab .drop:hover { color: #b3261e; background: none }
  #build-tab .empty { color: #94918a }
  /* Six columns and every one of them is in the paste, so the narrow-window rules above leave them alone. */
  #build-tab th, #build-tab td { display: table-cell }

  /* Putting rows on the build list gives a little back: the truck rolls, its lamp blinks and the count floats
     up over the tab, in a color picked fresh each time (--pop). Now and then it comes up big (.crit), and the
     copy - the thing all the picking was for - runs longest (.big). */
  :root { --pop: #b25a00 }
  @keyframes roll { from { opacity: 1; transform: translateX(-9px) } to { opacity: .3; transform: none } }
  @keyframes blink { 0%, 100% { color: #b25a00 } 40% { color: var(--pop); text-shadow: 0 0 7px var(--pop) } }
  @keyframes rise { from { opacity: 1 } to { opacity: 0; transform: translate(-50%, -28px) } }
  @keyframes flash { 0%, 100% { color: inherit } 40% { color: var(--pop) } }
  .logo.rolling .speed { color: var(--pop); animation: roll .45s var(--d) ease-out }
  .logo.rolling .lamp { animation: blink .45s ease-in-out }
  .logo.rolling.crit .speed { animation-duration: .5s; animation-iteration-count: 3 }
  .logo.rolling.crit .lamp { animation-duration: .35s; animation-iteration-count: 4 }
  .logo.rolling.big .speed { animation-duration: .9s; animation-iteration-count: 2 }
  #buildTotals.flash div { animation: flash .5s ease-in-out 2 }
  /* The jackpot is the copy's own, and comes after .big and .crit so it beats both: the truck sweeps long and
     fast at once, and the totals go through three colours one after another, each a beat behind the last. */
  .logo.rolling.jackpot .speed { animation-duration: .4s; animation-iteration-count: 5 }
  .logo.rolling.jackpot .lamp { animation-duration: .3s; animation-iteration-count: 7 }
  @keyframes jackpot { 0%, 100% { color: inherit } 20% { color: var(--pop) }
                       50% { color: var(--pop2) } 80% { color: var(--pop3) } }
  #buildTotals.jackpot div { animation: jackpot 1.1s ease-in-out 2 }
  #buildTotals.jackpot div:nth-child(2) { animation-delay: .08s }
  #buildTotals.jackpot div:nth-child(3) { animation-delay: .16s }
  #buildTotals.jackpot div:nth-child(4) { animation-delay: .24s }
  /* Fixed, not absolute: the header scrolls away in a long report and the count still has to be seen. */
  .pop { position: fixed; z-index: 2; transform: translate(-50%, 0); pointer-events: none;
         color: var(--pop); font-weight: 600; animation: rise .9s ease-out forwards }
  .pop.crit { font-size: 1.9em; text-shadow: 0 0 12px var(--pop) }
  /* Nothing here says anything the page doesn't say in words, so it can all go. */
  @media (prefers-reduced-motion: reduce) {
    .logo.rolling .speed, .logo.rolling .lamp, #buildTotals.flash div, #buildTotals.jackpot div,
    .pop { animation: none }
    .pop { display: none }
  }

  /* Help tab: kept to a readable width. */
  .help { max-width: 96ch; line-height: 1.6 }
  .help h1 { margin: 4px 0 8px; font-size: 1.5em }
  .help h2 { margin: 28px 0 8px; font-size: 1.2em }
  .help p, .help ul { margin: 8px 0 }
  .help ul { padding-left: 2.5ch }
  .help code { padding: 0 3px; background: #efece5; white-space: nowrap }
  .help pre { padding: 8px 12px; overflow-x: auto; border: 1px solid #e0ddd6; background: #f2f0eb; line-height: 1.4 }
</style>
</head>
<body>
<header>
<pre class="logo" role="img" aria-label="wave">
     <span class="frame">┌─────────────────────────┐</span>
<span class="speed">  ── </span><span class="frame">│</span> █   █ ▄▀▀▀▄ █   █ ▄▀▀▀▀ <span class="frame">│ ┌───┐</span>
<span class="speed"> ─── </span><span class="frame">│</span> █ ▀ █ █▀▀▀█ ▀▄ ▄▀ █▀▀▀  <span class="frame">│═╡ <span class="lamp">▪</span> └┐</span>
<span class="speed">   ─ </span><span class="frame">│</span> ▀▀ ▀▀ ▀   ▀   ▀   ▀▀▀▀▀ <span class="frame">│ │    │</span>
     <span class="frame">└──●─●───────────────●─●──┘ └●──●┘</span></pre>
<div class="brand"><b>wave</b><br>open orders, sorted<br><span id="version"></span></div>
</header>
<!-- The tabs read as commands, like the filter bar: one word each, with the longer wording in the tooltip. -->
<nav id="tabs"><button data-tab="search-tab" class="on" title="The whole open orders export, filtered (alt+s)">search</button><button
  data-tab="inspect-tab" title="One trip, or one order, in full (alt+i)">inspect</button><button
  id="buildTab" data-tab="build-tab" title="The list you build for the wave sheet (alt+b)">build</button><button
  data-tab="help-tab" title="How to use this page (alt+h)">help</button></nav>
<main>
<section id="search-tab">
  <div class="tools">
    <label class="button">open csv<input type="file" id="csv" accept=".csv" hidden></label>
    <span id="progress"></span>
    <span id="filename"></span>
  </div>
  <!-- clear sits at the end of the line it empties, as plain text, and only while there is something to empty. -->
  <div class="bar"><span>&gt;</span><input id="flags" autocomplete="off" spellcheck="false"
    placeholder="type filters or click them below; Enter runs them"><button id="clear" hidden>clear filters (esc)</button></div>
  <div id="message" class="message"></div>
  <div id="tags"></div>
  <div id="stats" class="stats">Pick an open orders export. It stays in this browser.</div>
  <!-- save and bld all act on the table, so they sit with it rather than up with open csv. -->
  <div class="tools table-tools">
    <button id="bldSelected">bld (b)</button>
    <button id="bldAll">bld all (ctrl+b)</button>
    <button id="save">save table (ctrl+s)</button>
  </div>
  <table id="report"></table>
</section>
<section id="inspect-tab" hidden>
  <div class="bar"><span>trip or order &gt;</span><input id="tripNumber" autocomplete="off" spellcheck="false"
    placeholder="a trip or order number; Enter shows it. Or click any number in search"></div>
  <div id="tripMessage" class="message"></div>
  <div id="tripView"></div>
</section>
<section id="build-tab" hidden>
  <div class="tools table-tools">
    <button id="copyBuild">copy build (ctrl+c)</button>
    <button id="dropSelected">drop (d)</button>
    <button id="clearBuild">clear (ctrl+d)</button>
  </div>
  <div id="buildMessage" class="message"></div>
  <div id="buildTotals"></div>
  <div id="buildView"></div>
