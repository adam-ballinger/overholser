<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ovh</title>
<style>
  :root { color-scheme: light }
  body { margin: 0; padding: 12px 16px; background: #faf9f7; color: #1b1b19;
         font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace }
  button, .button { font: inherit; padding: 2px 10px; border: 1px solid #c9c6bf; background: #f2f0eb;
                    color: inherit; cursor: pointer }
  button:hover, .button:hover { background: #e8e5de }
  /* Header: the logo, a truck hauling "ovh", with the name and version beside it (under it on a phone).
     Line height 1 so the box and block characters join up. Only characters Consolas has, so it lines up
     on any Windows machine. */
  header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 20px; margin-bottom: 10px }
  .logo { margin: 0; font: inherit; line-height: 1 }
  .logo .frame { color: #94918a }
  .logo .speed { color: #d3d0c9 }
  .logo .lamp { color: #b25a00 }
  .brand { padding-bottom: 2px; line-height: 1.4; color: #94918a }
  .brand b { color: #1b1b19 }
  #version { color: #8a5a00 }
  /* Tabs: the one showing is underlined. */
  #tabs { display: flex; margin: 0 -16px 12px; padding: 0 16px; border-bottom: 1px solid #c9c6bf }
  #tabs button { margin-bottom: -1px; padding: 4px 14px; border: 0; border-bottom: 2px solid transparent;
                 background: none; color: #94918a }
  #tabs button:hover { color: #1b1b19 }
  #tabs button.on { color: #1b1b19; border-bottom-color: #1b1b19 }

  /* Search tab */
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px }
  #filename { color: #55534d }
  /* The loading bar: "████████░░░░░░░░░░░░  40% reading". */
  #progress { color: #94918a }
  #progress b { font-weight: normal; color: #b25a00 }
  #progress i { font-style: normal; color: #d3d0c9 }
  .table-tools { justify-content: flex-end; margin-bottom: 6px }  /* Copy and Save, at the right above the table */
  /* The filter bar reads as a prompt: "> --today --thd", with room around it to type in. */
  .bar { display: flex; align-items: center; gap: 8px; margin: 18px 0; border-bottom: 1px solid #c9c6bf }
  .bar > span { color: #94918a }
  /* clear (esc) is a word at the end of the bar, not another box beside the boxes above it. */
  #clear { padding: 0 0 2px; border: 0; background: none; color: #94918a }
  #clear:hover { color: #1b1b19; background: none; text-decoration: underline }
  .bar input { flex: 1; min-width: 0; font: inherit; padding: 4px 0; border: 0; outline: none; background: none; color: inherit }
  .message { color: #a4271c }
  /* Every flag the report takes, a row of buttons per group. */
  #tags { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px }
  #tags div { display: flex; flex-wrap: wrap; gap: 4px }
  #tags button { padding: 0 6px }
  .stats { display: flex; flex-wrap: wrap; gap: 2px 24px; margin: 18px 0 14px; color: #55534d }
  .stats .headline { flex-basis: 100%; color: #1b1b19 }
  .stats b { font-weight: normal; color: #94918a }
  /* The rows you clicked, each marked down its left edge: what bld and drop act on. */
  tr[data-add], tr[data-drop] { cursor: pointer }
  tr.on td { background: #e2ddd1 }
  tr.on td:first-child { box-shadow: inset 3px 0 #1b1b19 }
  /* A trip (or an order not on one) in the report: click it to see it in the inspect tab. */
  a[data-find] { cursor: pointer; color: inherit; text-decoration: underline dotted #94918a }
  a[data-find]:hover { text-decoration-style: solid }
  /* Columns keep the report's proportions but are shares of the window, so it always fits. */
  table { width: 100%; table-layout: fixed; border-collapse: collapse }
  th { text-align: left; font-weight: 600; padding: 2px 8px 4px 0; border-bottom: 1px dashed #b5b1a8 }
  td { padding: 1px 8px 1px 0 }
  /* One line per row, cut with an ellipsis the way the report cuts to its column width. */
  th, td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  tr:hover td:not(.group) { background: #efece5 }
  /* Divider above each ship date group (late, today, tomorrow, future) and each inspect tab table. */
  .group { padding: 14px 0 3px; border-bottom: 1px solid #b5b1a8; color: #94918a }
  .group b { color: #1b1b19; letter-spacing: 1px }
  .group.late, .group.late b { color: #b3261e; border-bottom-color: #b3261e }
  .right { text-align: right }
  .id { color: #8a5a00 }                                 /* order numbers */
  .danger { background: #b3261e; color: #fff }           /* late ship date, short allocation */
  .warning { background: #b25a00; color: #fff }          /* split allocation, Holds, the 144" tag */
  .cyan { background: #0e7c86; color: #fff }             /* the flr-mtl tag (temporary) */
  .danger, .warning, .cyan { padding: 0 3px }            /* on the text only, so a little room around it */
  /* Narrow windows drop columns rather than squeezing every one of them; a phone keeps
     what you can't read the row without: one order number, the date, dollars, allocation. */
  @media (max-width: 900px) { .ship-method, .items { display: none } }
  @media (max-width: 600px) {
    .ship-to, .trip, .orders, .lines, .cases, .line-statuses { display: none }
    .po, .delivery, .customer, .hold, .pieces, .onhand { display: none }  /* the inspect tab's tables */
  }

  /* Inspect tab: each trip under a heading, with its bld button at the right, tables a little apart. */
  .trip-detail h2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;
                    margin: 22px 0 0; font-size: 1.3em }
  .trip-detail h2 .muted { font-weight: normal; color: #94918a }
  /* font: inherit on buttons would take the heading's size and weight, so this one says its own. */
  .add { margin-left: auto; font-size: 13px; font-weight: normal }
  .trip-detail table { margin-bottom: 6px }

  /* Build tab: the list, with an x at the end of each row to take it off again. */
  /* What the list comes to, big, since it is the answer the tab exists to give. */
  #buildTotals { display: flex; flex-wrap: wrap; gap: 6px 36px; margin: 4px 0 16px }
  #buildTotals div { font-size: 26px; line-height: 1.1 }
  #buildTotals span { display: block; font-size: 13px; color: #94918a }
  #build-tab .num { color: #94918a }                     /* the row numbers */
  #build-tab .drop { padding: 2px 10px; border: 0; background: none; color: #94918a }
  #build-tab .drop:hover { color: #b3261e; background: none }
  #build-tab .empty { color: #94918a }
  /* Six columns and every one of them is in the paste, so the narrow-window rules above leave them alone. */
  #build-tab th, #build-tab td { display: table-cell }

  /* Help tab: kept to a readable width. */
  .help { max-width: 96ch; line-height: 1.6 }
  .help h1 { margin: 4px 0 8px; font-size: 1.5em }
  .help h2 { margin: 28px 0 8px; font-size: 1.2em }
  .help p, .help ul { margin: 8px 0 }
  .help ul { padding-left: 2.5ch }
  .help code { padding: 0 3px; background: #efece5; white-space: nowrap }
  .help pre { padding: 8px 12px; overflow-x: auto; border: 1px solid #e0ddd6; background: #f2f0eb; line-height: 1.4 }
</style>
</head>
<body>
<header>
<pre class="logo" role="img" aria-label="ovh">
     <span class="frame">┌─────────────────────┐</span>
<span class="speed">  ── </span><span class="frame">│</span> ▄▀▀▀▄  █   █  █   █ <span class="frame">│ ┌───┐</span>
<span class="speed"> ─── </span><span class="frame">│</span> █   █  ▀▄ ▄▀  █▀▀▀█ <span class="frame">│═╡ <span class="lamp">▪</span> └┐</span>
<span class="speed">   ─ </span><span class="frame">│</span>  ▀▀▀     ▀    ▀   ▀ <span class="frame">│ │    │</span>
     <span class="frame">└──●─●───────────●─●──┘ └●──●┘</span></pre>
<div class="brand"><b>overholser</b><br>open orders, sorted<br><span id="version"></span></div>
</header>
<!-- The tabs read as commands, like the filter bar: one word each, with the longer wording in the tooltip. -->
<nav id="tabs"><button data-tab="search-tab" class="on" title="The whole open orders export, filtered">search</button><button
  data-tab="inspect-tab" title="One trip, or one order, in full">inspect</button><button
  id="buildTab" data-tab="build-tab" title="The list you build for the wave sheet">build</button><button
  data-tab="help-tab" title="How to use this page">help</button></nav>
<main>
<section id="search-tab">
  <div class="tools">
    <label class="button">Open CSV<input type="file" id="csv" accept=".csv" hidden></label>
    <span id="progress"></span>
    <span id="filename"></span>
  </div>
  <!-- clear sits at the end of the line it empties, as plain text, and only while there is something to empty. -->
  <div class="bar"><span>&gt;</span><input id="flags" autocomplete="off" spellcheck="false"
    placeholder="type filters or click them below; Enter runs them"><button id="clear" hidden>clear filters (esc)</button></div>
  <div id="message" class="message"></div>
  <div id="tags"></div>
  <div id="stats" class="stats">Pick an open orders export. It stays in this browser.</div>
  <!-- Copy and Save act on the table, so they sit with it rather than up with Open CSV. -->
  <div class="tools table-tools">
    <button id="bldSelected">bld (b)</button>
    <button id="copy">Copy table</button>
    <button id="save">Save table</button>
  </div>
  <table id="report"></table>
</section>
<section id="inspect-tab" hidden>
  <div class="bar"><span>trip or order &gt;</span><input id="tripNumber" autocomplete="off" spellcheck="false"
    placeholder="a trip or order number; Enter shows it. Or click any number in search"></div>
  <div id="tripMessage" class="message"></div>
  <div id="tripView"></div>
</section>
<section id="build-tab" hidden>
  <div class="tools table-tools">
    <button id="copyBuild">Copy build</button>
    <button id="dropSelected">drop (d)</button>
    <button id="clearBuild">Clear</button>
  </div>
  <div id="buildMessage" class="message"></div>
  <div id="buildTotals"></div>
  <div id="buildView"></div>
</section>

<section id="help-tab" class="help" hidden></section>
</main>

<script src="ovh.js"></script>
<script>
// The page: tabs, the orders report, the help. All the loading, allocating and filtering is ovh.js's,
// loaded above as a plain script: everything it defines at the top level is a name this script can use.
// What bundle.js puts in for the built "ovh v<version>.html", since the page can't read files itself:
// { version } from package.json and { help } from HELP.md.
const BUNDLE = null;
version.textContent = BUNDLE ? `v${BUNDLE.version}` : 'dev, not bundled';

// Tabs: each button shows the section its data-tab names and hides the others.
function showTab(tab) {
  for (const button of tabs.children) button.classList.toggle('on', button.dataset.tab === tab);
  for (const section of document.querySelectorAll('main > section')) section.hidden = section.id !== tab;
  unpick();
}
tabs.addEventListener('click', e => e.target.dataset.tab && showTab(e.target.dataset.tab));

// ---- Search tab ----

let data = null;   // the export's report rows (loadOrders), once one is picked
let rows = [];     // the rows the flags picked last, in report order - what the stats and Copy table cover
let shownFlags = ''; // the filter line those rows came from (the bar may since hold a typo)

// The columns Copy table uses: the report's own, with its " ..." for "more than shown" turned into the "…" the
// browser ends a cut cell with. Items keeps to the report's width (its first few items), since an email doesn't
// cut cells to fit.
const COLUMNS_COPY = REPORT_COLUMNS.map(c => ['Order Numbers', 'Items'].includes(c.heading)
  ? { ...c, value: r => c.value(r).replace(/ \.\.\.$/, '…') } : c);
// The page's columns: the same, but Items lists every item and the browser cuts the cell to fit the window.
const COLUMNS_HTML = COLUMNS_COPY.map(c => c.heading === 'Items' ? { ...c, value: r => itemsCell(r, 999) } : c);
// Columns of 13 characters or less (dates, money, counts, numbers) keep their exact width (plus a character for
// the gap); the wide text columns share whatever the window has left, so the table always fits it and only they
// get cut short.
const th = c => `<th class="${slug(c)}${c.right ? ' right' : ''}"${c.width <= 13 ? ` style="width:${c.width + 1}ch"` : ''}>${c.heading}</th>`;

const mark = (text, color) => color ? `<span class="${color}">${esc(text)}</span>` : esc(text);
const slug = c => c.heading.toLowerCase().replace(/[^a-z]+/g, '-');
const esc = text => text.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// One cell. title shows the whole value when the column is too narrow for it. A color marks just the text, not
// the whole cell; in Items it's only the tags at the front (144", flr-mtl), each in its own color. The columns
// (and ITEM_TAGS) in ovh.js name the color class. The column's find names the trip and order numbers in the
// cell: each one becomes a link that looks it up in the inspect tab (the cell holds them space-separated).
function td(c, r) {
  const text = String(c.value(r));
  const classes = [slug(c), c.right && 'right', c.id && 'id'].filter(Boolean).join(' ');
  const find = c.find?.(r).filter(Boolean) ?? [];
  const color = c.color?.(r);
  const tags = c.tags ? ITEM_TAGS.filter(([, key]) => r[key]) : [];
  const body = tags.length
    ? tags.map(([tag, , tagColor]) => `<span class="${tagColor}">${esc(tag)}</span> `).join('')
      + esc(tags.reduce((rest, [tag]) => rest.slice(tag.length + 1), text)) // what follows "144" flr-mtl "
    : find.length ? linkNumbers(esc(text), find)
      : mark(text, color);
  return `<td class="${classes}" title="${esc(text)}">${body}</td>`;
}

// Every number of find's in the (already escaped) text, as a link. The last one can end in the "…" that means
// there are more than the cell shows, so the link takes the number and leaves the ellipsis beside it.
const linkNumbers = (text, find) => text.split(' ').map(word => {
  const number = word.replace(/…$/, '');
  return find.includes(number) ? `<a data-find="${number}">${number}</a>${word.slice(number.length)}` : word;
}).join(' ');

// What the rows picked add up to, under the report's counts line. Most of them are some of the rows,
// so they read the same way: "23 rows, $95,116.60".
const worth = rs => `${count(rs.length, 'row')}, ${money(total(rs, 'dollars'))}`;
// Allocation is counted in lines, not rows, since a split row holds both kinds: "412 lines short, $95,116.60".
const lineWorth = (rs, allocation) => {
  const ls = rs.flatMap(r => r.lines).filter(l => l.allocation === allocation);
  return `${ls.length.toLocaleString()} line${ls.length === 1 ? '' : 's'} ${allocation}, ${money(total(ls, 'dollars'))}`;
};
// [label, value]; the allocation ones say what they are in the value, so they have no label.
const STATS = [
  ['Late', rs => worth(rs.filter(r => r.late))],
  ['', rs => lineWorth(rs, 'short')],
  ['', rs => lineWorth(rs, 'alloc')],
  ['Holds', rs => worth(rs.filter(r => r.status === 'Holds'))],
  ['144"', rs => worth(rs.filter(r => r.has144))],
  ['Ship dates', rs => `${mdy(earliest(rs, 'shipDate'))} to ${mdy(new Date(Math.max(...rs.map(r => r.shipDate))))}`],
  // The channel with the most dollars on these rows, over their lines (a row can hold more than one).
  ['Biggest channel', rs => {
    const [channel, ls] = [...Map.groupBy(rs.flatMap(r => r.lines), l => l.salesChannel)]
      .sort((a, b) => total(b[1], 'dollars') - total(a[1], 'dollars'))[0];
    return `${channel}, ${money(total(ls, 'dollars'))}`;
  }],
];

// Every flag the bar takes: the plain ones (tags and OTHER_FLAGS), and the name filters, which take a value.
const TAG_GROUPS = Object.values(TAGS).map(group => Object.keys(group.flags));
const PLAIN_FLAGS = [...TAG_GROUPS.flat(), ...OTHER_FLAGS];
const NAMES = FILTERS.map(([name]) => name);

// '--today --shipto "ace hdw"' -> { today: true, shipto: ['ace hdw'] }, what rowMatches takes.
function parseFlags(text) {
  const opts = {};
  const tokens = text.match(/"[^"]*"|\S+/g) ?? [];
  for (let i = 0; i < tokens.length; i++) {
    const [, name, inline] = /^--([^=]+)(?:=(.*))?$/.exec(tokens[i]) ?? [];
    if (PLAIN_FLAGS.includes(name)) opts[name] = true;
    else if (!NAMES.includes(name)) throw new Error(`Unknown option '${tokens[i]}'`);
    else {
      const value = inline ?? tokens[++i];
      if (value === undefined) throw new Error(`--${name} needs a value`);
      (opts[name] ??= []).push(value.replace(/^"|"$/g, ''));
    }
  }
  return opts;
}

// The whole report: the counts line, a few numbers about the rows, then every row the flags pick, soonest
// ship date first. No one page limit, but only the first screenful is drawn now and the rest a tick later
// (see drawRows): building 1,500 rows takes a few hundred milliseconds, and clearing the filters asks for
// every row at once.
function render() {
  if (!data) return;
  let opts;
  try { opts = parseFlags(flags.value); } catch (e) { message.textContent = e.message; return; }
  message.textContent = '';
  showClear();
  shownFlags = flags.value.trim().replace(/\s+/g, ' ');
  const picked = data.filter(r => rowMatches(r, opts));
  rows = (opts.dollars ? topDollars(picked) : picked).toSorted(soonestFirst);
  stats.innerHTML = rows.length
    ? `<div class="headline">${ordersTotals(rows)}</div>`
      + STATS.map(([label, value]) => `<div>${label && `<b>${esc(label)}</b> `}${esc(value(rows))}</div>`).join('')
    : 'No matching rows';
  drawRows();
}

// The report's rows: a screenful straight away, then the rest once the browser has drawn those. drawing counts
// the draws, so rows from a filter the bar has moved on from never land in the table.
const FIRST_ROWS = 150;
let drawing = 0;
function drawRows() {
  const mine = ++drawing;
  report.innerHTML = rows.length ? headingRow(COLUMNS_HTML) + tableRows(COLUMNS_HTML, rows.slice(0, FIRST_ROWS)) : '';
  countSelected();
  if (rows.length <= FIRST_ROWS) return;
  setTimeout(() => {
    if (mine === drawing) report.insertAdjacentHTML('beforeend', tableRows(COLUMNS_HTML, rows.slice(FIRST_ROWS), FIRST_ROWS));
  });
}

// A row's ship date group, from the Ship Date Category of its earliest line (as of when the export was run).
// The categories follow date order, so rows sorted soonest first fall into these groups one after another.
const dateGroup = r => {
  const category = r.lines.find(l => +l.shipDate === +r.shipDate).shipDateCategory;
  return category.endsWith('Late') ? 'late' : category === 'Today' ? 'today' : category === 'Tomorrow' ? 'tomorrow' : 'future';
};

const headingRow = columns => `<tr>${columns.map(th).join('')}</tr>`;
// Rows of the report as HTML, each ship date group opened by a divider row that says what the whole group
// holds: "LATE  23 rows, $393,658.52". rs is all of `rows`, or a run of it starting at `from`, so a chunk
// drawn later carries on from the group the one before it ended in.
function tableRows(columns, rs, from = 0) {
  const groups = Map.groupBy(rows, dateGroup);
  return rs.map((r, i) => {
    const group = dateGroup(r);
    const opens = from + i === 0 || group !== dateGroup(rows[from + i - 1]);
    return (opens ? `<tr><td class="group ${group}" colspan="${columns.length}">${groupTitle(group, worth(groups.get(group)))}</td></tr>` : '')
      + bodyRow(columns, r, r.trip ? `${r.trip}|` : `|${r.orderNumbers[0]}`);
  }).join('');
}
// What a divider says: "<b>LATE</b>  23 rows, $393,658.52".
const groupTitle = (title, text) => `<b>${esc(title.toUpperCase())}</b>&nbsp; ${esc(text)}`;
// add: what this row puts on the build list, "trip|order" - one side of it empty, since a row is either a
// whole trip or one order. A row without it can be picked by nothing and added by nothing: a trip's items, say.
const bodyRow = (columns, r, add) => `<tr${add ? ` data-add="${esc(add)}"` : ''}>${columns.map(c => td(c, r)).join('')}</tr>`;
const bodyRows = (columns, rs, add) => rs.map(r => bodyRow(columns, r, add?.(r))).join('');

// Every flag the report takes, as buttons that type themselves into the bar: a row for each tag group (ship
// dates, channels, allocation, status, mode), the other plain flags, then the two that take a name. The lists
// are ovh.js's own, so a new flag turns up here on its own.
tags.innerHTML = [...TAG_GROUPS, OTHER_FLAGS, NAMES].map(group =>
  `<div>${group.map(n => `<button data-flag="${n}">--${n}</button>`).join('')}</div>`).join('');

tags.addEventListener('click', e => {
  const flag = e.target.dataset.flag;
  if (!flag) return;
  const takesValue = NAMES.includes(flag);
  const parts = flags.value.split(/\s+/).filter(Boolean);
  const at = parts.indexOf(`--${flag}`);
  // Clicking a flag that's already on the line takes it off again. One that needs a value waits for it.
  if (at >= 0 && !takesValue) parts.splice(at, 1);
  else parts.push(`--${flag}`);
  flags.value = parts.join(' ') + (takesValue ? ' ' : '');
  flags.focus();
  showClear();
  if (!takesValue) render();
});

// The loading bar, `share` (0 to 1) of 20 blocks filled, then what's happening.
const showProgress = (share, label) => {
  const filled = Math.round(share * 20);
  progress.innerHTML = `<b>${'█'.repeat(filled)}</b><i>${'░'.repeat(20 - filled)}</i> ${String(Math.round(share * 100)).padStart(3)}% ${label}`;
};
// Lets the browser draw the bar before a step that holds it up (loadOrders and render run in one go). A short
// timer rather than waiting for a frame, which never comes while the tab is in the background.
const paint = () => new Promise(resolve => setTimeout(resolve, 30));
let progressTimer;

// The file as text, moving the bar through the first 40% as it's read.
const readText = file => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onprogress = e => e.lengthComputable && showProgress(0.4 * e.loaded / e.total, 'reading');
  reader.onload = () => resolve(reader.result);
  reader.onerror = () => reject(reader.error);
  reader.readAsText(file);
});

// Loads a picked export, with the bar going: reading, sorting (allocation and grouping), drawing, then done and
// how long it took, which stays up for a few seconds.
csv.addEventListener('change', async () => {
  const file = csv.files[0];
  if (!file) return;
  clearTimeout(progressTimer);
  filename.textContent = file.name;
  const start = performance.now();
  try {
    showProgress(0, 'reading');
    const text = await readText(file);
    showProgress(0.45, 'sorting orders');
    await paint();
    data = loadOrders(text);
    showProgress(0.85, 'drawing');
    await paint();
  } catch (e) { data = null; progress.textContent = ''; message.textContent = e.message; return; }
  render();
  showTrip();
  drawBuild();
  showProgress(1, `done in ${((performance.now() - start) / 1000).toFixed(1)}s`);
  progressTimer = setTimeout(() => progress.textContent = '', 4000);
  flags.focus();
});
// Enter runs the line. Esc is handled for the whole page, further down, since it has two jobs now.
flags.addEventListener('keydown', e => {
  if (e.key === 'Enter') render();
});
// A trip or order number clicked anywhere on the page - the report, or one trip's orders - looks it up in the
// inspect tab. One listener over every tab, since the tables are redrawn.
document.querySelector('main').addEventListener('click', e => {
  const find = e.target.closest('[data-find]')?.dataset.find;
  if (find) { tripNumber.value = find; showTab('inspect-tab'); showTrip(); return; }
  // Anywhere else on a row picks it, and picks it off again: no modifier to hold, and as many rows as you like.
  e.target.closest('tr[data-add], tr[data-drop]')?.classList.toggle('on');
  countSelected();
});
// Esc does the nearer job first: it lets go of the picked rows, and once there are none it empties the bar.
// So pressing it twice always ends up with nothing picked and no filters, whatever you were doing.
function escape() {
  if (document.querySelector('tr.on')) unpick();
  else { flags.value = ''; flags.focus(); render(); }
  showClear();
}
clear.addEventListener('click', escape);
// The word at the end of the bar says which of the two Esc will do, so the key never has to be guessed at. It
// only shows while there is something to clear, so an empty page has one less thing on it.
function showClear() {
  const picked = !!document.querySelector('tr.on');
  clear.textContent = picked ? 'clear picked (esc)' : 'clear filters (esc)';
  clear.hidden = !picked && !flags.value.trim();
}
flags.addEventListener('input', showClear);

// A pasted table carries no stylesheet, so each cell takes its own style. Same colors as above. Cells stay on
// one line, so each column is as wide as its longest value and no wider.
const inlineStyle = cell => [cell.tagName === 'SPAN' ? 'padding:0 3px' : 'padding:2px 10px 2px 0;white-space:nowrap',
  cell.tagName === 'TH' && 'font-weight:600;text-align:left;border-bottom:1px solid #b5b1a8',
  cell.classList.contains('right') && 'text-align:right',
  cell.classList.contains('danger') && 'background:#b3261e;color:#fff',
  cell.classList.contains('warning') && 'background:#b25a00;color:#fff',
  cell.classList.contains('cyan') && 'background:#0e7c86;color:#fff',
  cell.classList.contains('id') && 'color:#8a5a00',
  cell.classList.contains('group') && 'padding:12px 0 2px;border-bottom:1px solid #b5b1a8',
  cell.classList.contains('late') && 'color:#b3261e;border-bottom-color:#b3261e',
].filter(Boolean).join(';');

// The table as the email gets it: built apart from the page, so none of the page's own table styles (its
// window-wide, fixed-width columns) come along; only the inline styles above.
function emailTable() {
  const table = document.createElement('table');
  table.innerHTML = headingRow(COLUMNS_COPY) + tableRows(COLUMNS_COPY, rows);
  table.setAttribute('style', 'border-collapse:collapse;font-family:Consolas,monospace;font-size:12px');
  // The inspect tab's links mean nothing in an email: keep the number, drop the link.
  for (const link of table.querySelectorAll('a')) link.replaceWith(...link.childNodes);
  for (const row of table.querySelectorAll('tr')) { row.removeAttribute('class'); row.removeAttribute('data-add'); }
  for (const cell of table.querySelectorAll('th, td, span')) {
    cell.setAttribute('style', inlineStyle(cell));
    if (cell.tagName !== 'SPAN') cell.setAttribute('nowrap', ''); // Outlook skips white-space, not this
    cell.removeAttribute('class');
    cell.removeAttribute('title');
  }
  return table.outerHTML;
}

// Puts exactly this text (and HTML, when there is any) on the clipboard, instead of whatever the browser would
// make of a selection. True if it went.
function toClipboard(text, html) {
  const fill = e => {
    if (html) e.clipboardData.setData('text/html', html);
    e.clipboardData.setData('text/plain', text);
    e.preventDefault();
  };
  document.addEventListener('copy', fill);
  const copied = document.execCommand('copy');
  document.removeEventListener('copy', fill);
  return copied;
}

// Copies the whole table, ready to paste into an email: that table as HTML, and tab-separated text for plain
// email or a spreadsheet. Every column goes, even the ones a narrow window is hiding.
copy.addEventListener('click', () => {
  if (!rows.length) return;
  const text = [COLUMNS_COPY.map(c => c.heading), ...rows.map(r => COLUMNS_COPY.map(c => String(c.value(r))))]
    .map(cells => cells.join('\t')).join('\n');
  const copied = toClipboard(text, emailTable());
  message.textContent = copied ? '' : 'Could not copy the table';
  if (copied) {
    // Ctrl+Shift+V (which Outlook on the web suggests when its own Paste button can't read the clipboard) drops the colors.
    copy.textContent = `Copied ${rows.length} rows: paste with Ctrl+V`;
    setTimeout(() => copy.textContent = 'Copy table', 4000);
  }
});

// Saves the same table as an HTML file, under a heading that says what it is: the filters, the export and the
// counts line. For when a pasted copy loses its formatting: open the file, or attach it.
save.addEventListener('click', () => {
  if (!rows.length) return;
  const title = `ovh orders ${shownFlags}`.trim();
  const page = `<!doctype html>
<html><head><meta charset="utf-8"><title>${esc(title)}</title></head>
<body style="font-family:Consolas,monospace;font-size:12px">
<p><b>${esc(title)}</b><br>${esc(filename.textContent)}<br>${esc(ordersTotals(rows))}</p>
${emailTable()}
</body></html>`;
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([page], { type: 'text/html' }));
  // "2026-09-16 ovh --late --thd.html" (en-CA writes the date that way), without the characters a Windows
  // file name can't have, like the quotes around a --shipto name.
  link.download = `${new Date().toLocaleDateString('en-CA')} ovh ${shownFlags}`.trim().replace(/[\\/:*?"<>|]/g, '') + '.html';
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
});

// ---- Inspect tab ----


// Everything about one report row: a heading, what it adds up to, then its orders and its items, the items
// with stock problems first. order: the order number looked up, when the row came from one - the heading
// then leads with that order and says which trip it's on.
const PROBLEMS_FIRST = { short: 0, split: 1, alloc: 2 };
function tripDetail(r, order) {
  const channels = [...Map.groupBy(r.lines, l => l.salesChannel)]
    .map(([channel, ls]) => [channel, total(ls, 'dollars')]).sort((a, b) => b[1] - a[1])
    .map(([channel, dollars]) => `${channel} ${money(dollars)}`).join(', ');
  const shipDates = [...new Set(r.lines.toSorted((a, b) => a.shipDate - b.shipDate).map(l => mdy(l.shipDate)))];
  const holds = r.orders.filter(o => o.onHold).length;
  const deliveries = new Set(r.lines.map(l => l.delivery).filter(Boolean)).size;
  const facts = [
    ['Ship method', esc(variations(r.lines.map(l => l.shippingMethod), 'ship methods'))],
    ['Ship date', mark(shipDates.length > 1 ? `${shipDates[0]} to ${shipDates.at(-1)}` : shipDates[0], r.late && 'danger')
      + ` ${dateGroup(r)}`],
    ['Ship to', esc(r.shipTos)],
    ['Status', mark(r.status, warnStatus(r.status))],
    ['Alloc', mark(r.allocation, ALLOC_COLUMN.color(r))],
    ['Line statuses', esc(r.lineStatuses)],
    ['', mark(lineWorth([r], 'short'), r.allocation !== 'alloc' && 'danger')],
    ['On hold', holds ? mark(count(holds, 'order'), 'warning') : 'none'],
    ['Channels', esc(channels)],
  ];
  const headline = [count(r.orders.length, 'order'), `${deliveries} deliver${deliveries === 1 ? 'y' : 'ies'}`,
    count(r.lines.length, 'line'), count(total(r.items, 'pieces'), 'piece'), count(r.cases, 'case'), money(r.dollars)].join(', ');
  // The title goes above the table, not in it: a fixed layout table takes its column widths from its first row.
  const table = (title, note, columns, rs, add) => `<div class="group">${groupTitle(title, note)}</div>`
    + `<table><tr>${columns.map(th).join('')}</tr>${bodyRows(columns, rs, add)}</table>`;
  // The trip in "Order 54056588 on Trip 7983534" links to the trip itself, the whole thing rather than this
  // order's part of it. The heading of a trip looked up by its own number is where that link would land.
  const title = order
    ? `Order ${esc(order)} ${r.trip
      ? `<span class="muted">on</span> Trip <a data-find="${esc(r.trip)}">${esc(r.trip)}</a>`
      : '<span class="muted">not on a trip</span>'}`
    : `Trip ${esc(r.trip)}`;
  // The button adds what the heading names: the trip, or the one order looked up on it.
  return `<h2><span>${title}</span><button class="add" data-add="${esc(`${r.trip}|${order || ''}`)}">bld (ctrl+b)</button></h2>
<div class="stats"><div class="headline">${headline}</div>
${facts.map(([label, value]) => `<div>${label && `<b>${label}</b> `}${value}</div>`).join('')}</div>
${table('Orders', r.orders.length.toLocaleString(), TRIP_ORDER_COLUMNS, r.orders, o => `${r.trip}|${o.orderNumber}`)}
${table('Items', `${r.items.length.toLocaleString()}, short and split first`, TRIP_ITEM_COLUMNS,
    r.items.toSorted((a, b) => PROBLEMS_FIRST[a.allocation] - PROBLEMS_FIRST[b.allocation]))}`;
}

// Shows the trip whose number is in the box, or, if no trip has that number, the order itself - as its own row
// (makeRow over just its lines), so its totals, orders and items are the order's and not its whole trip's. An
// order split across trips gets one of these per trip, and each heading links the trip it is a part of.
function showTrip() {
  const number = tripNumber.value.trim();
  tripMessage.textContent = '';
  tripView.innerHTML = '';
  if (!number) return;
  if (!data) { tripMessage.textContent = 'Open an export in the search tab first'; return; }
  const trip = data.filter(r => r.trip === number);
  const found = trip.length ? trip : data.filter(r => r.orderNumbers.includes(number)).toSorted(soonestFirst)
    .map(r => makeRow(r.orders.find(o => o.orderNumber === number).lines));
  if (!found.length) { tripMessage.textContent = `No trip or order ${number} in this export`; return; }
  if (found.length > 1) tripMessage.textContent = `Order ${number} is on ${found.length} rows`;
  tripView.innerHTML = found.map(r => `<div class="trip-detail">${tripDetail(r, !trip.length && number)}</div>`).join('');
}
tripNumber.addEventListener('keydown', e => { if (e.key === 'Enter') showTrip(); });

tripView.addEventListener('click', e => {
  const button = e.target.closest('button[data-add]');
  if (button) addToBuild(button.dataset.add);
});
// Ctrl+B adds wherever you are on the inspect tab, since Enter in the bar has just looked the trip up and b on
// its own belongs to the selected row. An order on more than one trip shows a button per trip, but they all
// name that order, so the first will do.
document.addEventListener('keydown', e => {
  const button = tripView.querySelector('button[data-add]');
  if (e.key === 'b' && e.ctrlKey && button && !document.getElementById('inspect-tab').hidden) {
    e.preventDefault();
    addToBuild(button.dataset.add);
  }
});

// ---- Build tab ----

// The trips and orders to paste into the wave sheet, in the order they were added. Entries rather than rows
// ({ trip, order }, order being '' for a whole trip): a new export makes new rows, so buildRow in ovh.js looks
// each entry up again every time the list is drawn, which refreshes them and drops whatever has gone.
let build = [];

// Adds one "trip|order", the row's own: an order split over two trips is two rows, and picking one of them
// puts that part on and not the other. Nothing the export doesn't hold, and nothing already on the list, so a
// trip can't be pasted twice.
function addToBuild(spec) {
  const [trip, order] = spec.split('|');
  if (!data || !buildRow({ trip, order }, data)) return;
  if (!build.some(e => e.trip === trip && e.order === order)) build.push({ trip, order });
  drawBuild();
}

// What the list comes to in the export showing now, the entries that find nothing dropped as it goes, so the
// table and the paste can never show a trip that has already shipped.
function buildRows() {
  const found = build.map(entry => buildRow(entry, data ?? []));
  build = build.filter((entry, i) => found[i]);
  return found.filter(Boolean);
}

// The count is on the tab, since a number added from search or inspect lands out of sight.
function drawBuild() {
  const rows = buildRows();
  countSelected();
  buildTab.textContent = build.length ? `build ${build.length}` : 'build';
  buildTotals.innerHTML = rows.length ? [
    ['rows', rows.length],
    ['orders', new Set(rows.flatMap(r => r.orderNumbers)).size],
    ['lines', rows.reduce((t, r) => t + r.lines.length, 0)],
    ['cases', total(rows, 'cases')],
  ].map(([label, n]) => `<div>${n.toLocaleString()}<span>${label}</span></div>`).join('') : '';
  // The number in front and the × behind are the list's own, not columns: they count and act on the list
  // rather than saying anything the wave sheet takes.
  buildView.innerHTML = rows.length
    ? `<table><tr><th class="num" style="width:4ch">#</th>${BUILD_COLUMNS.map(th).join('')}<th style="width:5ch"></th></tr>`
      + rows.map((r, i) => `<tr data-drop="${i}"><td class="num">${i + 1}</td>${BUILD_COLUMNS.map(c => td(c, r)).join('')}`
        + `<td><button class="drop" data-drop="${i}" title="take this off the list">×</button></td></tr>`).join('')
      + '</table>'
    : '<p class="empty">Nothing on the list yet. Click a row on search or inspect, then <b>bld</b>.</p>';
}
drawBuild();

// buildRows has just put build in the same order as the table, so a row's number is its place on the list.
function dropFromBuild(i) {
  build.splice(i, 1);
  drawBuild();
}
buildView.addEventListener('click', e => {
  const drop = e.target.closest('button[data-drop]');
  if (drop) dropFromBuild(drop.dataset.drop);
});
clearBuild.addEventListener('click', () => { build = []; drawBuild(); });

// Click the rows you want, then bld or drop - by the button, or by the key beside its name. The picked rows are
// the ones marked down their left edge, wherever they are: the report, a trip's orders, or the list itself. A
// row a button can't act on is simply not its own: only the list's rows have a data-drop, only the others add.
function pickedRows(what) { return [...document.querySelectorAll(`tr.on[data-${what}]`)]; }
// The buttons say how many they are about to act on, since the rows may be scrolled away from them.
function countSelected() {
  const add = pickedRows('add').length, drop = pickedRows('drop').length;
  bldSelected.textContent = add ? `bld ${add} (b)` : 'bld (b)';
  dropSelected.textContent = drop ? `drop ${drop} (d)` : 'drop (d)';
  showClear();
}
function addPicked() {
  const rows = pickedRows('add');
  for (const tr of rows) addToBuild(tr.dataset.add);
  // Added rows let go of themselves: they're on the list now, and the marks left behind would only be in the
  // way of picking the next few.
  if (rows.length) unpick();
  return rows.length;
}
function dropPicked() {
  // Highest place first: dropping a row moves every row under it up one.
  const places = pickedRows('drop').map(tr => +tr.dataset.drop).sort((a, b) => b - a);
  for (const i of places) build.splice(i, 1);
  if (places.length) drawBuild();
  return places.length;
}
// Clears the picks. The tab you leave keeps none, so what a button says is always what you can see.
function unpick() {
  for (const tr of document.querySelectorAll('tr.on')) tr.classList.remove('on');
  countSelected();
}
bldSelected.addEventListener('click', () => { if (!addPicked()) message.textContent = 'Click a row first, then bld'; });
dropSelected.addEventListener('click', () => { if (!dropPicked()) buildMessage.textContent = 'Click a row first, then drop'; });
// Not while a bar has the typing, and not when a modifier is down: b is a letter before it's a shortcut.
document.addEventListener('keydown', e => {
  // Esc is the one that works while a bar has the typing, since emptying that bar is half its job.
  if (e.key === 'Escape') { escape(); return; }
  if (e.ctrlKey || e.altKey || e.metaKey || e.target.matches?.('input')) return;
  if (e.key === 'b') addPicked();
  if (e.key === 'd') dropPicked();

});

// The whole list as the wave sheet takes it, one waveLine per row. Text only, no HTML: the sheet takes
// tab-separated cells, and waveLine already writes them the way Excel reads them.
copyBuild.addEventListener('click', () => {
  const rows = buildRows();
  if (!rows.length) return;
  const copied = toClipboard(rows.map(waveLine).join('\n'));
  buildMessage.textContent = copied ? '' : 'Could not copy the list';
  if (copied) {
    copyBuild.textContent = `Copied ${count(rows.length, 'row')}: paste with Ctrl+V`;
    setTimeout(() => copyBuild.textContent = 'Copy build', 4000);
  }
});

// ---- Help tab ----

// HELP.md -> HTML: headings, paragraphs, bullet lists (nested by indent), code blocks, `code` and **bold**.
// Just what the help uses; anything else shows as plain text.
function markdown(text) {
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const out = [];
  const lists = []; // the indent of each open bullet list, innermost last
  let code = false, para = false;
  const endPara = () => { if (para) out.push('</p>'); para = false; };
  const endLists = (indent = -1) => { while (lists.at(-1) > indent) { out.push('</li></ul>'); lists.pop(); } };
  for (const line of text.split(/\r?\n/)) {
    if (line.startsWith('```')) { endPara(); endLists(); out.push(code ? '</pre>' : '<pre>'); code = !code; continue; }
    if (code) { out.push(esc(line) + '\n'); continue; }
    const heading = /^(#+) (.*)/.exec(line);
    const bullet = /^( *)- (.*)/.exec(line);
    if (!line.trim()) { endPara(); endLists(); }
    else if (heading) { endPara(); endLists(); out.push(`<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`); }
    else if (bullet) {
      const indent = bullet[1].length;
      endPara();
      endLists(indent);
      // A bullet at the same indent is the next item; a deeper one starts a list inside the item above.
      if (lists.at(-1) === indent) out.push('</li>');
      else { out.push('<ul>'); lists.push(indent); }
      out.push(`<li>${inline(bullet[2])}`);
    }
    else if (lists.length) out.push(` ${inline(line.trim())}`); // a bullet's text running onto the next line
    else { out.push(para ? ' ' : '<p>', inline(line.trim())); para = true; }
  }
  endPara();
  endLists();
  return out.join('');
}

document.getElementById('help-tab').innerHTML = BUNDLE ? markdown(BUNDLE.help)
  : '<p>The help shows here in the built "ovh v<version>.html". Build that with <code>node bundle.js</code>.</p>';
</script>
</body>
</html>
